{% extends 'base.html' %}{% block content %}<h2>Audit Log</h2><div class="card p-3"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Timestamp (UTC)</th><th>User</th><th>Action</th><th>Record type</th><th>Record ID</th></tr></thead><tbody>{% for x in items %}<tr><td>{{x.timestamp}}</td><td>{{x.user.full_name if x.user else 'System'}}</td><td>{{x.action}}</td><td>{{x.record_type or ''}}</td><td>{{x.record_id or ''}}</td></tr>{% else %}<tr><td colspan="5">No audit entries.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
