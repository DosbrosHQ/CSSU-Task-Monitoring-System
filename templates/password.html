{% extends 'base.html' %}{% block content %}<div class="card p-4 col-lg-6"><h3>Change password</h3><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" required><label class="form-label">New password (at least 12 characters)</label><input class="form-control mb-3" type="password" name="new_password" minlength="12" required><label class="form-label">Confirm new password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="12" required><button class="btn btn-primary">Update password</button></form></div>{% endblock %}
